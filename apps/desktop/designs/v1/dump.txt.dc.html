<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;height:100%;font-family:"Segoe UI",sans-serif;}
a{color:inherit}a:hover{color:inherit}
textarea::placeholder{color:light-dark(#a3a3a3,#5c5c5c)}
@keyframes panel-appear{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide-in{from{transform:translateY(var(--from))}to{transform:translateY(0)}}
.dump-scroll::-webkit-scrollbar{width:12px;height:12px}
.dump-scroll::-webkit-scrollbar-track,.dump-scroll::-webkit-scrollbar-corner{background:light-dark(#f0f0f0,#252525)}
.dump-scroll::-webkit-scrollbar-thumb{background:light-dark(#b8b8b8,#686868);border:3px solid light-dark(#f0f0f0,#252525);border-radius:6px}
.dump-scroll::-webkit-scrollbar-button{display:none;width:0;height:0}
</style>
</helmet>
<div style="color-scheme:{{ scheme }}; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:light-dark(#d4d4d4,#141414); color:light-dark(#1a1a1a,#e6e6e6); font-family:'Segoe UI',sans-serif;">
  <div ref="{{ frameRef }}" onKeyDown="{{ onKey }}" style="width:min(960px,100%); height:min(700px,calc(100vh - 48px)); display:grid; grid-template-rows:40px 40px minmax(0,1fr) 40px {{ statusRow }}; background:light-dark(#fafafa,#2c2c2c); color:light-dark(#1a1a1a,#e6e6e6); border-radius:8px; box-shadow:0 24px 64px rgba(0,0,0,.28); position:relative; overflow:hidden;">

    <header style="display:grid; grid-template-columns:minmax(138px,1fr) minmax(0,auto) minmax(138px,1fr); align-items:center; height:40px; user-select:none; background:light-dark(#e6e6e6,#1e1e1e);">
      <div style="grid-column:1; grid-row:1; width:fit-content; height:40px; display:flex;">
        <button onClick="{{ toggleMenu }}" aria-label="App menu" title="App menu" style="width:46px; height:40px; padding:0; border:0; display:grid; place-items:center; flex:none; background:{{ menuTriggerBg }}; color:inherit; cursor:default;" style-hover="background:light-dark(#e8e8e8,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
        </button>
      </div>
      <span style="grid-column:2; grid-row:1; font-family:Arial,sans-serif; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; letter-spacing:.14em; color:light-dark(#9a9a9a,#6a6a6a);">dump.txt</span>
      <div style="grid-column:3; grid-row:1; height:40px; display:flex; justify-content:flex-end;">
        <button aria-label="Minimize" title="Minimize" style="width:46px; height:40px; border:0; display:grid; place-items:center; background:transparent; color:inherit; cursor:default;" style-hover="background:light-dark(#e8e8e8,#383838)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button aria-label="Maximize" title="Maximize" style="width:46px; height:40px; border:0; display:grid; place-items:center; background:transparent; color:inherit; cursor:default;" style-hover="background:light-dark(#e8e8e8,#383838)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
        <button aria-label="Close window" title="Close window" style="width:46px; height:40px; border:0; display:grid; place-items:center; background:transparent; color:inherit; cursor:default;" style-hover="background:#c42b1c; color:#fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </header>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeMenu }}" style="position:absolute; inset:0; z-index:19;"></div>
      <div class="dump-scroll" style="position:absolute; top:40px; left:0; z-index:20; width:264px; max-height:calc(100% - 40px); overflow-x:hidden; overflow-y:auto; background:light-dark(#e6e6e6,#1e1e1e); color:light-dark(#1a1a1a,#e6e6e6); box-shadow:0 8px 24px #0003; font:13px 'Segoe UI',sans-serif; animation:panel-appear 120ms ease-out;">
        <button onClick="{{ closeMenu }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
          <span>Open…</span><span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">Ctrl+O</span>
        </button>
        <button onClick="{{ closeMenu }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
          <span>Save As…</span><span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">Ctrl+Shift+S</span>
        </button>
        <div style="height:1px; background:light-dark(#f0f0f0,#404040);"></div>
        <button onClick="{{ closeMenu }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M2 15h10"/><path d="m9 18 3-3-3-3"/></svg>
          <span>Import page…</span>
        </button>
        <button onClick="{{ closeMenu }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M4 7V4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/><path d="M2 15h10"/><path d="m5 12-3 3 3 3"/></svg>
          <span>Export page…</span>
        </button>
        <div style="height:1px; background:light-dark(#f0f0f0,#404040);"></div>
        <button onClick="{{ undo }}" disabled="{{ noUndo }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default; opacity:{{ undoOpacity }};" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
          <span>Undo</span><span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">Ctrl+Z</span>
        </button>
        <button onClick="{{ redo }}" disabled="{{ noRedo }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default; opacity:{{ redoOpacity }};" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
          <span>Redo</span><span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">Ctrl+Y</span>
        </button>
        <button onClick="{{ openFind }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Find and replace</span><span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">Ctrl+F</span>
        </button>
        <div style="height:1px; background:light-dark(#f0f0f0,#404040);"></div>

        <div role="group" aria-label="Text size" style="display:flex; align-items:center; gap:12px; height:40px; padding-left:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
          <span>Text size</span>
          <div style="display:flex; align-items:center; margin-left:auto;">
            <button onClick="{{ sizeDown }}" aria-label="Decrease text size" style="justify-content:center; width:40px; height:40px; padding:0; border:0; background:transparent; color:inherit; display:grid; place-items:center; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span style="min-width:40px; text-align:center; font-variant-numeric:tabular-nums;">{{ textSize }} pt</span>
            <button onClick="{{ sizeUp }}" aria-label="Increase text size" style="justify-content:center; width:40px; height:40px; padding:0; border:0; background:transparent; color:inherit; display:grid; place-items:center; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          </div>
        </div>

        <button onClick="{{ openFontPicker }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="m3 15 4-8 4 8"/><path d="M4 13h6"/><circle cx="18" cy="12" r="3"/><path d="M21 9v6"/></svg>
          <span>Font…</span><span style="margin-left:auto; max-width:120px; overflow:hidden; text-overflow:ellipsis; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">{{ fontName }}</span>
        </button>

        <div style="position:relative;">
          <button onClick="{{ toggleAppearance }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:{{ appearanceBg }}; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="m14.622 17.897-10.68-2.913"/><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"/><path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15"/></svg>
            <span>Appearance</span>
            <span style="margin-left:auto; color:light-dark(#9a9a9a,#a0a0a0); font-size:11px;">{{ themeLabel }}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <button onClick="{{ toggleStatusBar }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 15h18"/></svg>
          <span>{{ statusBarLabel }}</span>
        </button>
        <button onClick="{{ openKeybinds }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>
          <span>Keybinds</span>
        </button>
        <div style="height:1px; background:light-dark(#f0f0f0,#404040);"></div>
        <button onClick="{{ closeMenu }}" style="display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          <span>Close</span>
        </button>
      </div>
      <sc-if value="{{ appearanceOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:{{ appearanceTop }}; left:264px; z-index:21; width:max-content; min-width:160px; background:light-dark(#e6e6e6,#1e1e1e); box-shadow:0 8px 24px #0003; animation:panel-appear 120ms ease-out;">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.pick }}" style="position:relative; display:flex; align-items:center; gap:12px; width:100%; height:40px; box-sizing:border-box; padding:0 12px 0 32px; border:0; background:transparent; color:inherit; font:inherit; white-space:nowrap; text-align:left; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
              <span style="position:absolute; left:12px; display:grid; place-items:center; opacity:{{ t.checkOpacity }};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              <span>{{ t.label }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>

    <nav aria-label="Previous page controls" style="height:40px; display:grid; grid-template-columns:46px minmax(0,1fr) 92px; position:relative; color:light-dark(#8a8a8a,#6e6e6e); background:light-dark(#f0f0f0,#252525);">
      <div style="display:flex;">
        <button onClick="{{ insertAbove }}" aria-label="Insert page above" title="Insert page above (Ctrl+Shift+N)" style="width:46px; height:40px; padding:0; border:0; display:grid; place-items:center; flex:none; background:transparent; color:inherit; cursor:default;" style-hover="background:#16803c; color:#fff">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <button onClick="{{ goUp }}" disabled="{{ atFirst }}" aria-label="Previous page" title="Previous page (Alt+Up)" style="display:grid; place-items:center; padding:0 0 0 46px; border:0; background:transparent; color:inherit; cursor:default; visibility:{{ upVisibility }};" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <div style="display:flex;">
        <button onClick="{{ moveUp }}" aria-label="Move page up" title="Move page up" style="width:46px; height:40px; padding:0; border:0; display:grid; place-items:center; flex:none; background:transparent; color:inherit; cursor:default;" style-hover="background:light-dark(#e8e8e8,#383838); color:light-dark(#1a1a1a,#e6e6e6)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 11-6-6-6 6"/><path d="M12 5v10"/><path d="M5 19h14"/></svg>
        </button>
        <button onClick="{{ goFirst }}" disabled="{{ atFirst }}" aria-label="First page" title="First page (Ctrl+Home)" style="width:46px; height:40px; padding:0; border:0; display:grid; place-items:center; flex:none; background:transparent; color:inherit; cursor:default; opacity:{{ firstOpacity }};" style-hover="background:light-dark(#e8e8e8,#383838); color:light-dark(#1a1a1a,#e6e6e6)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg>
        </button>
      </div>
    </nav>

    <section aria-label="Current page" style="position:relative; overflow:hidden; min-height:0;">
      <div key="{{ pageKey }}" style="position:absolute; inset:0; min-height:0; background:light-dark(#fafafa,#2c2c2c); animation:{{ pageAnimation }};">
        <textarea ref="{{ editorRef }}" value="{{ text }}" onChange="{{ onChange }}" onSelect="{{ onSelect }}" onKeyUp="{{ onSelect }}" onClick="{{ onSelect }}" placeholder="{{ placeholder }}" spellcheck="false" class="dump-scroll" style="width:100%; height:100%; box-sizing:border-box; padding:10px 14px; border:0; outline:0; resize:none; background:transparent; color:inherit; font-family:{{ fontStack }}; font-size:{{ textSize }}pt; line-height:1.5;"></textarea>
      </div>

      <sc-if value="{{ findOpen }}" hint-placeholder-val="{{ false }}">
        <div role="dialog" aria-label="Find and replace" style="position:absolute; top:0; right:0; z-index:5; width:min(400px,100%); box-sizing:border-box; background:light-dark(#f0f0f0,#252525); box-shadow:0 6px 20px #0002; font:13px 'Segoe UI',sans-serif; display:grid; animation:panel-appear 120ms ease-out;">
          <div style="display:flex; align-items:center; height:40px; font-size:12px;">
            <input ref="{{ findRef }}" value="{{ query }}" onChange="{{ onQuery }}" onKeyDown="{{ onFindKey }}" aria-label="Find text" placeholder="Find" style="flex:1 1 120px; min-width:0; width:0; height:28px; margin:6px; box-sizing:border-box; border:0; padding:0 12px; background:light-dark(#e6e6e6,#383838); color:inherit; font:inherit;" />
            <button onClick="{{ findPrev }}" disabled="{{ noMatches }}" aria-label="Previous match" title="Previous match (Shift+Enter)" style="height:40px; width:46px; flex:none; padding:0; border:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:inherit; cursor:default; opacity:{{ matchOpacity }};" style-hover="background:light-dark(#e8e8e8,#383838)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
            <button onClick="{{ findNext }}" disabled="{{ noMatches }}" aria-label="Next match" title="Next match (Enter)" style="height:40px; width:46px; flex:none; padding:0; border:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:inherit; cursor:default; opacity:{{ matchOpacity }};" style-hover="background:light-dark(#e8e8e8,#383838)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>

  themeSetting() { return this.state.theme ?? this.props.theme ?? "system"; }
  size() { return this.state.textSize ?? this.props.textSize ?? 11; }
  sizeUp = () => this.setState({ textSize: Math.min(24, this.size() + 1) });
  sizeDown = () => this.setState({ textSize: Math.max(8, this.size() - 1) });
  fontValue() { return this.state.font ?? this.props.font ?? "Consolas"; }
  openFontPicker = () => this.setState({ menuOpen: false, appearanceOpen: false, fontPickerOpen: true, fontQuery: "", fontDraft: this.fontValue() });
  closeFontPicker = () => { this.setState({ fontPickerOpen: false }); this.focusEditor(); };
  applyFont = () => { this.setState(s => ({ font: s.fontDraft ?? s.font, fontPickerOpen: false })); this.focusEditor(); };
  openKeybinds = () => this.setState({ menuOpen: false, appearanceOpen: false, keybindsOpen: true });
  closeKeybinds = () => { this.setState({ keybindsOpen: false }); this.focusEditor(); };
  toggleStatusBar = () => this.setState(s => ({ showStatusBar: !(s.showStatusBar ?? this.props.showStatusBar ?? true), menuOpen: false }));

  onKey = e => {
    if (e.key === "Escape") { this.setState({ menuOpen: false, appearanceOpen: false }); return; }
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod) {
      if (k === "n") { e.preventDefault(); this.insert(e.shiftKey ? "above" : "below"); }
      else if (k === "z" && !e.shiftKey) { e.preventDefault(); this.undo(); }
      else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); this.redo(); }
      else if (k === "f") { e.preventDefault(); this.openFind(); }
      else if (k === "delete") { e.preventDefault(); this.deletePage(); }
      else if (k === "home") { e.preventDefault(); this.goFirst(); }
      else if (k === "end") { e.preventDefault(); this.goLast(); }
      else if (k === "0") { e.preventDefault(); this.setState({ textSize: 11 }); }
      else if (k === "=" || k === "+") { e.preventDefault(); this.sizeUp(); }
      else if (k === "-") { e.preventDefault(); this.sizeDown(); }
      return;
    }
    if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); this.goUp(); }
    else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); this.goDown(); }
    else if (k === "pageup") { e.preventDefault(); this.goUp(); }
    else if (k === "pagedown") { e.preventDefault(); this.goDown(); }
  };

  renderVals() {
    const s = this.state;
    const page = this.cur();
    const text = page.text;
    const m = this.matches();
    const atFirst = s.index === 0, atLast = s.index === s.pages.length - 1;
    const theme = this.themeSetting();
    const font = this.fontValue();
    const showStatusBar = s.showStatusBar ?? this.props.showStatusBar ?? true;
    const before = text.slice(0, s.caret).split("\n");
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const draft = s.fontDraft ?? font;
    const q = s.fontQuery.toLowerCase();
    return {
      scheme: theme === "system" ? "light dark" : theme,
      textSize: this.size(), fontName: font, fontStack: stackFor(font),
      text, onChange: this.onChange, onSelect: this.onSelect, editorRef: this.editorRef,
      placeholder: s.pages.length === 1 && !text ? "Just start typing." : "",
      pageKey: `p${page.id}`,
      pageAnimation: s.transitionId && s.direction ? `slide-in 200ms cubic-bezier(.2,.7,.2,1)` : "none",
      showStatusBar, statusRow: showStatusBar ? "24px" : "0px",
      countLabel: `${text.length} chars · ${words} words · ${text.split("\n").length} lines`,
      positionLabel: `Ln ${before.length}, Col ${(before[before.length - 1] || "").length + 1}`,
      pageLabel: `Pages ${s.index + 1} / ${s.pages.length}`,
      atFirst, atLast,
      upVisibility: atFirst ? "hidden" : "visible", downVisibility: atLast ? "hidden" : "visible",
      firstOpacity: atFirst ? .3 : 1, lastOpacity: atLast ? .3 : 1,
      menuOpen: s.menuOpen, menuTriggerBg: s.menuOpen ? "light-dark(#e8e8e8,#383838)" : "transparent",
      toggleMenu: () => this.setState(t => ({ menuOpen: !t.menuOpen, appearanceOpen: false })),
      closeMenu: () => this.setState({ menuOpen: false, appearanceOpen: false }),
      noUndo: !page.past.length, noRedo: !page.future.length,
      undoOpacity: page.past.length ? 1 : .3, redoOpacity: page.future.length ? 1 : .3,
      appearanceOpen: s.appearanceOpen, appearanceBg: s.appearanceOpen ? "light-dark(#f0f0f0,#383838)" : "transparent",
      appearanceTop: `${s.appearanceTop}px`,
      frameRef: this.frameRef,
      toggleAppearance: e => {
        const row = e.currentTarget.getBoundingClientRect();
        const frame = this.frameRef.current && this.frameRef.current.getBoundingClientRect();
        const top = frame ? Math.max(40, Math.min(frame.height - 120, row.top - frame.top)) : 200;
        this.setState(t => ({ appearanceOpen: !t.appearanceOpen, appearanceTop: top }));
      },
      themeLabel: theme[0].toUpperCase() + theme.slice(1),
      themes: ["system", "light", "dark"].map(t => ({ label: t[0].toUpperCase() + t.slice(1), checkOpacity: theme === t ? 1 : 0, pick: () => this.setState({ theme: t, appearanceOpen: false, menuOpen: false }) })),
      statusBarLabel: showStatusBar ? "Hide status bar" : "Show status bar",
      findOpen: s.findOpen, query: s.query, replacement: s.replacement, matchCase: s.matchCase, allPages: s.allPages,
      matchCaseTick: s.matchCase ? "visible" : "hidden", allPagesTick: s.allPages ? "visible" : "hidden",
      noMatches: !m.length, matchOpacity: m.length ? 1 : .3,
      matchLabel: !m.length || s.matchIdx < 0 ? `${m.length} matches` : `${Math.min(s.matchIdx + 1, m.length)} of ${m.length}`,
      findRef: this.findRef,
      fontPickerOpen: s.fontPickerOpen, fontQuery: s.fontQuery,
      onFontQuery: e => this.setState({ fontQuery: e.target.value }),
      fontOptions: FONTS.filter(n => n.toLowerCase().includes(q)).map(name => ({
        name, stack: stackFor(name), selected: name === draft,
        bg: name === draft ? "light-dark(#d0d0d0,#505050)" : "transparent",
        pick: () => this.setState({ fontDraft: name }),
      })),
      keybindsOpen: s.keybindsOpen,
      keybindGroups: KEYBINDS.map(g => ({ title: g.title, bindings: g.bindings.map(([label, keys]) => ({ label, keys })) })),
      insertAbove: this.insertAbove, insertBelow: this.insertBelow, goUp: this.goUp, goDown: this.goDown,
      goFirst: this.goFirst, goLast: this.goLast, moveUp: this.moveUp, moveDown: this.moveDown, deletePage: this.deletePage,
      undo: this.undo, redo: this.redo, openFind: this.openFind, closeFind: this.closeFind,
      onQuery: this.onQuery, onReplacement: this.onReplacement, onMatchCase: this.onMatchCase, onAllPages: this.onAllPages,
      findNext: this.findNext, findPrev: this.findPrev, replaceOne: this.replaceOne, replaceAll: this.replaceAll, onFindKey: this.onFindKey,
      sizeUp: this.sizeUp, sizeDown: this.sizeDown, openFontPicker: this.openFontPicker, closeFontPicker: this.closeFontPicker,
      applyFont: this.applyFont, openKeybinds: this.openKeybinds, closeKeybinds: this.closeKeybinds,
      toggleStatusBar: this.toggleStatusBar, onKey: this.onKey,
    };
  }
}
</script>
</body>
</html>
