[package]
name = "dump-txt"
version = "0.3.2"
description = "A minimal desktop scratchpad with pages"
authors = ["Matt Cavender"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "dump-txt"
path = "src/main/main.rs"

[lib]
path = "src/main/lib.rs"
name = "dump_txt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
atomic-write-file = "=0.3.1"
dunce = "=1.0.5"
font-kit = { version = "=0.14.3", default-features = false, features = ["source"] }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
probe = []
automation = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[lints.rust]
nonstandard_style = "deny"
