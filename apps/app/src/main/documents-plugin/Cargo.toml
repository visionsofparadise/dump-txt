[package]
name = "tauri-plugin-documents"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
links = "tauri-plugin-documents"

[lib]
path = "lib.rs"

[build-dependencies]
tauri-plugin = { version = "=2.6.3", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false }

[lints.rust]
nonstandard_style = "deny"
