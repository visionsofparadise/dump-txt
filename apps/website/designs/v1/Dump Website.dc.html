    <div style="position:absolute; right:64px; top:56px; width:656px; height:788px; transform:{{ tilt }}; transform-origin:right center;">

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bgSaturation&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:130,&quot;min&quot;:0,&quot;max&quot;:200,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;shadowY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;shadowBlur&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;shadowOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:90,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;ambientY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:48,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;ambientBlur&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:32,&quot;min&quot;:0,&quot;max&quot;:96,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;ambientOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:25,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Desktop&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tilt = this.props.tilt ?? true;
    const p = this.props;
    const y = p.shadowY ?? 4, blur = p.shadowBlur ?? 6, a = (p.shadowOpacity ?? 35) / 100;
    const y2 = p.ambientY ?? 12, blur2 = p.ambientBlur ?? 32, a2 = (p.ambientOpacity ?? 25) / 100;
    const k = 0.8; // mobile scale
    const mk = (s) => `0 ${Math.round(y*s)}px ${Math.round(blur*s)}px rgba(0,0,0,${a}), 0 ${Math.round(y2*s)}px ${Math.round(blur2*s)}px rgba(0,0,0,${a2})`;
    const drop = (s) => `drop-shadow(0 ${Math.round(y*s)}px ${Math.round(blur*s)}px rgba(0,0,0,${a})) drop-shadow(0 ${Math.round(y2*s)}px ${Math.round(blur2*s)}px rgba(0,0,0,${a2}))`;
    return {
      tilt: tilt ? "perspective(2400px) rotateY(-7deg)" : "none",
      bgFilter: `saturate(${p.bgSaturation ?? 130}%)`,
      shadow: mk(1), shadowSm: mk(k), dropShadow: drop(1), dropShadowSm: drop(k),
      shadowWindow: `${mk(1)}, 0 32px 80px rgba(0,0,0,${a2})`,
    };
  }
}
</script>
