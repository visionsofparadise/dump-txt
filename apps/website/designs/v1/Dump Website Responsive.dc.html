<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Archivo+Narrow:wght@400;500&family=Roboto+Condensed:wght@300;400&family=Barlow+Condensed:wght@300;400&family=Oswald:wght@300;400&family=Saira+Condensed:wght@300;400&family=Sofia+Sans+Extra+Condensed:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#1a1a1a;font-family:system-ui,sans-serif;}
a{color:inherit}a:hover{color:inherit}
@keyframes arch-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
a:hover [data-meta]{color:#d6ead9 !important}
/* breakpoint: below 1000px stack like the mobile board */
#hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:auto 1fr auto auto;}
#headline{grid-column:1;grid-row:1;justify-self:start;}
#controls{grid-column:1;grid-row:3;align-items:flex-start;}
#github{grid-column:1;grid-row:4;justify-self:start;}
#app{grid-column:2;grid-row:1/5;align-self:stretch;min-height:0;}
#appbox{position:relative;height:100%;min-height:560px;transform:var(--tilt);transform-origin:right center;}
#mobile-gap{display:none;}
@media (max-width:999px){
  #hero{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;padding:72px 20px 40px !important;column-gap:0 !important;row-gap:72px !important;}
  #headline{grid-column:1;grid-row:1;justify-self:center;font-size:17vw !important;margin-top:0 !important;}
  #app{grid-column:1;grid-row:2;}
  #appbox{height:460px;min-height:0;transform:none;}
  #controls{grid-column:1;grid-row:3;align-items:stretch;}
  #controls > *{width:100% !important;min-width:0 !important;justify-content:center !important;}
  #github{grid-column:1;grid-row:4;justify-self:center;margin-top:-24px;}
  #bg{position:absolute !important;background-position:42% center !important;background-size:auto 100% !important;}
}
</style>
</helmet>

<div style="position:relative; isolation:isolate; min-height:100vh; font-family:'Instrument Serif',serif; color:#fafafa;">
  <div id="bg" style="position:fixed; inset:0; z-index:-1; background:url(uploads/bliss-like-web.webp) center/cover no-repeat; filter:{{ bgFilter }};"></div>

  <main id="hero" style="display:grid; column-gap:5vw; row-gap:48px; width:100%; min-height:100vh; margin:0; padding:56px 4.5vw 56px 5.5vw; box-sizing:border-box;">
    <h1 id="headline" style="margin:32px 0 0; width:max-content; max-width:100%; text-align:left; font-size:clamp(64px,10.5vw,220px); line-height:.9; letter-spacing:-.02em; font-weight:400; text-shadow:{{ shadow }};"><span style="position:relative; z-index:2; display:block; white-space:nowrap; font-family:{{ headFont }}; font-weight:{{ headWeight }}; letter-spacing:{{ headTracking }}; font-size:{{ headScale }}; line-height:1;">Dump te<span style="margin-left:.03em;">x</span><span style="margin-left:.045em;">t,</span></span><em style="position:relative; z-index:1; display:block; font-size:{{ thinkScale }}; margin-top:{{ thinkShift }}; font-style:italic; color:#e6e6e6;">think <span style="letter-spacing:.02em;">less.</span></em></h1>

    <div id="controls" style="display:flex; flex-direction:column; gap:14px; font-family:'IBM Plex Mono',monospace;">
      <div role="group" aria-label="Platform and architecture" style="display:flex; align-items:center; justify-content:center; flex-wrap:wrap; width:max-content; min-height:52px; background:#fafafa; border-radius:3px; color:#1a1a1a; font-size:13px; box-shadow:{{ shadow }};">
        <span role="radiogroup" aria-label="Platform" style="display:flex; align-items:center; gap:2px; padding:0 8px;">
          <button role="radio" aria-checked="{{ isWin }}" onClick="{{ pickWin }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:0; background:transparent; font:inherit; cursor:pointer; transition:color .28s; color:{{ winColor }}; --bar:{{ winBar }};" style-after="content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; background:#1a1a1a; transform-origin:left center; transform:var(--bar); transition:transform .28s cubic-bezier(.2,.7,.2,1);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 11 4.4v7.1H3zM12.5 4.2 21 3v8.5h-8.5zM3 12.5h8v7.1L3 18.5zM12.5 12.5H21V21l-8.5-1.2z"/></svg>Windows</button>
          <button role="radio" aria-checked="{{ isMac }}" onClick="{{ pickMac }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:0; background:transparent; font:inherit; cursor:pointer; transition:color .28s; color:{{ macColor }}; --bar:{{ macBar }};" style-after="content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; background:#1a1a1a; transform-origin:left center; transform:var(--bar); transition:transform .28s cubic-bezier(.2,.7,.2,1);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7 0 0-2.7-1-2.7-4.2zM14.1 5.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg>macOS</button>
          <button role="radio" aria-checked="{{ isLinux }}" onClick="{{ pickLinux }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:0; background:transparent; font:inherit; cursor:pointer; transition:color .28s; color:{{ linuxColor }}; --bar:{{ linuxBar }};" style-after="content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; background:#1a1a1a; transform-origin:left center; transform:var(--bar); transition:transform .28s cubic-bezier(.2,.7,.2,1);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c-2.5 0-4 2-4 4.8 0 1.2-.3 2-1 3.2-1 1.5-2.3 3.3-2.3 5.4 0 .7.1 1.3.4 1.8-.8.3-1.6.8-1.6 1.6 0 1.1 1.6 1.5 3.3 1.9.9.2 1.6 1.3 3 1.3.8 0 1.4-.3 2.2-.3s1.4.3 2.2.3c1.4 0 2.1-1.1 3-1.3 1.7-.4 3.3-.8 3.3-1.9 0-.8-.8-1.3-1.6-1.6.3-.5.4-1.1.4-1.8 0-2.1-1.3-3.9-2.3-5.4-.7-1.2-1-2-1-3.2C16 4 14.5 2 12 2zm-1.5 4a.8 1 0 1 1 0 2 .8 1 0 0 1 0-2zm3 0a.8 1 0 1 1 0 2 .8 1 0 0 1 0-2zM12 8.5c1 0 2 .5 2 1.1 0 .6-1.2 1.2-2 1.4-.8-.2-2-.8-2-1.4 0-.6 1-1.1 2-1.1zm0 3.5c1.8 0 3.3 2.2 3.3 4.4 0 1.9-1.5 2.8-3.3 2.8s-3.3-.9-3.3-2.8c0-2.2 1.5-4.4 3.3-4.4z"/></svg>Linux</button>
        </span>
        <span style="width:1px; height:28px; background:#e6e6e6;"></span>
        <span role="radiogroup" aria-label="Architecture" style="display:flex; align-items:center; gap:2px; padding:0 8px;">
          <sc-for list="{{ archOptions }}" as="a" hint-placeholder-count="1">
            <button key="{{ a.id }}" role="radio" aria-checked="{{ a.selected }}" onClick="{{ a.pick }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:0; background:transparent; font:inherit; cursor:pointer; transition:color .28s; color:{{ a.color }}; animation:arch-in .28s cubic-bezier(.2,.7,.2,1) both; --bar:{{ a.bar }};" style-after="content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; background:#1a1a1a; transform-origin:left center; transform:var(--bar); transition:transform .28s cubic-bezier(.2,.7,.2,1);">{{ a.label }}</button>
          </sc-for>
        </span>
      </div>
      <a href="#" style="display:inline-flex; align-items:center; justify-content:space-between; gap:24px; width:max-content; min-width:300px; white-space:nowrap; height:56px; padding:0 22px; box-sizing:border-box; border-radius:3px; background:#1a1a1a; color:#fafafa; text-decoration:none; font-size:14px; letter-spacing:.02em; box-shadow:{{ shadow }}; transition:background .25s;" style-hover="background:#16a34a">
        <span style="display:inline-flex; align-items:center; gap:10px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
          <span>Download for</span>
          <span style="display:inline-flex; align-items:center; gap:7px;">
            <sc-if value="{{ isWin }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 11 4.4v7.1H3zM12.5 4.2 21 3v8.5h-8.5zM3 12.5h8v7.1L3 18.5zM12.5 12.5H21V21l-8.5-1.2z"/></svg></sc-if>
            <sc-if value="{{ isMac }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7 0 0-2.7-1-2.7-4.2zM14.1 5.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg></sc-if>
            <sc-if value="{{ isLinux }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c-2.5 0-4 2-4 4.8 0 1.2-.3 2-1 3.2-1 1.5-2.3 3.3-2.3 5.4 0 .7.1 1.3.4 1.8-.8.3-1.6.8-1.6 1.6 0 1.1 1.6 1.5 3.3 1.9.9.2 1.6 1.3 3 1.3.8 0 1.4-.3 2.2-.3s1.4.3 2.2.3c1.4 0 2.1-1.1 3-1.3 1.7-.4 3.3-.8 3.3-1.9 0-.8-.8-1.3-1.6-1.6.3-.5.4-1.1.4-1.8 0-2.1-1.3-3.9-2.3-5.4-.7-1.2-1-2-1-3.2C16 4 14.5 2 12 2zm-1.5 4a.8 1 0 1 1 0 2 .8 1 0 0 1 0-2zm3 0a.8 1 0 1 1 0 2 .8 1 0 0 1 0-2zM12 8.5c1 0 2 .5 2 1.1 0 .6-1.2 1.2-2 1.4-.8-.2-2-.8-2-1.4 0-.6 1-1.1 2-1.1zm0 3.5c1.8 0 3.3 2.2 3.3 4.4 0 1.9-1.5 2.8-3.3 2.8s-3.3-.9-3.3-2.8c0-2.2 1.5-4.4 3.3-4.4z"/></svg></sc-if>
            {{ platformLabel }}
          </span>
        </span>
        <span data-meta="" style="font-size:11px; color:#9a9a9a; transition:color .25s;">{{ meta }}</span>
      </a>
    </div>

    <a id="github" href="#" aria-label="GitHub" style="display:grid; place-items:center; width:44px; height:44px; color:#fafafa; text-decoration:none; filter:{{ dropShadow }};"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg></a>

    <div id="app">
      <div id="appbox" style="--tilt:{{ tilt }};">
        <dc-import name="DumpMock" shadow="{{ shadowWindow }}" style="position:absolute; inset:0;" hint-size="100%,100%"></dc-import>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;headFont&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Roboto Condensed&quot;,&quot;Archivo Narrow&quot;,&quot;Barlow Condensed&quot;,&quot;Oswald&quot;,&quot;Saira Condensed&quot;,&quot;Sofia Sans Extra Condensed&quot;,&quot;Instrument Serif&quot;],&quot;default&quot;:&quot;Archivo Narrow&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline&quot;},&quot;thinkSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:87,&quot;min&quot;:50,&quot;max&quot;:130,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Headline&quot;},&quot;thinkY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-8,&quot;min&quot;:-30,&quot;max&quot;:30,&quot;step&quot;:1,&quot;unit&quot;:&quot;% of size&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Headline&quot;},&quot;bgSaturation&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:130,&quot;min&quot;:0,&quot;max&quot;:200,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;shadowY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;shadowBlur&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;shadowOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:90,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · key&quot;},&quot;ambientY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:48,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;ambientBlur&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:32,&quot;min&quot;:0,&quot;max&quot;:96,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;ambientOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:25,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shadow · ambient&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Desktop&quot;}}">
const PLATFORMS = {
  windows: { label: "Windows", archs: [["x64", "x64"]], meta: "v1.2 · 4 MB" },
  mac: { label: "macOS", archs: [["arm64", "Apple Silicon"], ["x64", "Intel"]], meta: "v1.2 · 5 MB" },
  linux: { label: "Linux", archs: [["x64", "x64"], ["arm64", "ARM64"]], meta: "v1.2 · 4 MB" },
};
class Component extends DCLogic {
  state = { platform: "windows", arch: "x64" };
  pick = (platform) => this.setState({ platform, arch: PLATFORMS[platform].archs[0][0] });
  renderVals() {
    const p = this.props;
    const { platform, arch } = this.state;
    const pl = PLATFORMS[platform];
    const sel = (on) => ({ color: on ? "#1a1a1a" : "#8a8a8a", bar: on ? "scaleX(1)" : "scaleX(0)" });
    const w = sel(platform === "windows"), m = sel(platform === "mac"), l = sel(platform === "linux");
    const tilt = p.tilt ?? true;
    const y = p.shadowY ?? 4, blur = p.shadowBlur ?? 5, a = (p.shadowOpacity ?? 90) / 100;
    const y2 = p.ambientY ?? 12, blur2 = p.ambientBlur ?? 32, a2 = (p.ambientOpacity ?? 25) / 100;
    const shadow = `0 ${y}px ${blur}px rgba(0,0,0,${a}), 0 ${y2}px ${blur2}px rgba(0,0,0,${a2})`;
    const FONTS = {
      "Instrument Serif": ["'Instrument Serif', serif", 400, "-.02em", 1],
      "Archivo Narrow": ["'Archivo Narrow', sans-serif", 400, "-.02em", .96],
      "Roboto Condensed": ["'Roboto Condensed', sans-serif", 300, "-.02em", .98],
      "Barlow Condensed": ["'Barlow Condensed', sans-serif", 300, "-.01em", 1.1],
      "Oswald": ["'Oswald', sans-serif", 300, "-.01em", .98],
      "Saira Condensed": ["'Saira Condensed', sans-serif", 300, "-.01em", 1.06],
      "Sofia Sans Extra Condensed": ["'Sofia Sans Extra Condensed', sans-serif", 300, "0", 1.3],
    };
    const f = FONTS[p.headFont ?? "Roboto Condensed"] || FONTS["Roboto Condensed"];
    return {
      isWin: platform === "windows", isMac: platform === "mac", isLinux: platform === "linux",
      pickWin: () => this.pick("windows"), pickMac: () => this.pick("mac"), pickLinux: () => this.pick("linux"),
      winColor: w.color, winBar: w.bar, macColor: m.color, macBar: m.bar, linuxColor: l.color, linuxBar: l.bar,
      archOptions: pl.archs.map(([id, label]) => ({ id: platform + id, label, selected: arch === id, ...sel(arch === id), pick: () => this.setState({ arch: id }) })),
      platformLabel: pl.label, meta: pl.meta,
      headFont: f[0], headWeight: f[1], headTracking: f[2], headScale: `${f[3]}em`, thinkScale: `${(p.thinkSize ?? 87) / 100}em`, thinkShift: `${(p.thinkY ?? 0) / 100}em`,
      tilt: tilt ? "perspective(2400px) rotateY(-7deg)" : "none",
      bgFilter: `saturate(${p.bgSaturation ?? 130}%)`,
      shadow,
      dropShadow: `drop-shadow(0 ${y}px ${blur}px rgba(0,0,0,${a})) drop-shadow(0 ${y2}px ${blur2}px rgba(0,0,0,${a2}))`,
      shadowWindow: `${shadow}, 0 32px 80px rgba(0,0,0,${a2})`,
    };
  }
}
</script>
</body>
</html>
