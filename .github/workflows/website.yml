name: Website

on:
   release:
      types: [published]
   workflow_dispatch:
      inputs:
         tag:
            description: Published stable release tag to link (empty for the latest)
            required: false
            type: string

permissions:
   contents: read

concurrency:
   group: website
   cancel-in-progress: false

jobs:
   build:
      if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
      runs-on: ubuntu-24.04
      timeout-minutes: 20
      env:
         DUMP_TXT_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              ref: main
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Install dependencies
           env:
              npm_config_strict_allow_scripts: "true"
           run: |
              npm install -g npm@12
              npm ci --ignore-scripts
         - name: Link the release
           env:
              GH_TOKEN: ${{ github.token }}
           run: node apps/website/tools/fetchRelease.mjs
         - run: npx turbo build --filter=@dump-txt/website
         - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
           with:
              path: apps/website/dist

   deploy:
      needs: build
      runs-on: ubuntu-24.04
      permissions:
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
