name: README demonstration

on:
   release:
      types: [published]
   workflow_dispatch:
      inputs:
         tag:
            description: Published stable release tag to render
            required: true
            type: string

permissions:
   contents: read

concurrency:
   group: readme-demonstration
   cancel-in-progress: false

jobs:
   render:
      if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      env:
         DEMO_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              ref: ${{ env.DEMO_RELEASE_TAG }}
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Verify released source
           env:
              GH_TOKEN: ${{ github.token }}
           run: node apps/gif/tools/publish.mjs verify
         - name: Install renderer dependencies
           env:
              npm_config_strict_allow_scripts: "true"
           run: |
              npm install -g npm@12
              npm ci --ignore-scripts
              npx playwright install --with-deps chromium
              sudo apt-get update
              sudo apt-get install -y ffmpeg
         - run: npm run render --workspace @dump-txt/gif
         - name: Collect failed loop frames
           if: failure()
           run: |
              mkdir -p .scratch/demo-failure
              mapfile -t frames < <(find apps/gif/.scratch -path '*/frames/*.png' | sort)
              if ((${#frames[@]})); then
                 cp "${frames[0]}" .scratch/demo-failure/first.png
                 cp "${frames[-1]}" .scratch/demo-failure/last.png
              fi
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: failure()
           with:
              name: demonstration-failure
              path: .scratch/demo-failure
              include-hidden-files: true
              if-no-files-found: ignore
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: demonstration
              path: |
                 apps/gif/out/demo.gif
                 apps/gif/out/demo.json
              if-no-files-found: error

   publish:
      needs: render
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      env:
         DEMO_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              ref: ${{ env.DEMO_RELEASE_TAG }}
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              name: demonstration
              path: apps/gif/out
         - name: Replace the latest successful demonstration
           env:
              GH_TOKEN: ${{ github.token }}
           run: node apps/gif/tools/publish.mjs publish
