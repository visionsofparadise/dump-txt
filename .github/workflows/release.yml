name: Release

on: workflow_dispatch

permissions:
   contents: read

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   gate:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
              fetch-depth: 0
         - name: Refuse a released version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag="v$(jq -r .version apps/app/package.json)"
              if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
                 echo "::error::$tag is already released; bump the version"
                 exit 1
              fi
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - name: Free Linux runner disk space
           run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
         - name: Install pinned Rust toolchain
           run: rustup show
         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
           with:
              workspaces: apps/app -> target
              key: gate
              cache-on-failure: "true"
              save-if: ${{ github.ref == 'refs/heads/main' }}
         - run: npm ci
         - name: Install Linux native and driver dependencies
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev libfreetype6-dev webkit2gtk-driver xvfb fonts-dejavu
         - name: Install native WebDriver
           run: cargo install tauri-driver --version 2.0.6 --locked
         - run: npm run check
         - run: npm run unit
         - name: Integration and native persistence
           run: xvfb-run -a npm run integration
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: failure()
           continue-on-error: true
           with:
              name: tauri-evidence-gate
              retention-days: 1
              include-hidden-files: true
              path: |
                 apps/app/.scratch/tauri-persistence/
                 apps/app/.scratch/tauri-build.json
                 apps/app/target/release/dump-txt
              if-no-files-found: warn

   build:
      needs: gate
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 artifact: windows-x64
               - os: windows-11-arm
                 artifact: windows-arm64
               - os: ubuntu-24.04
                 artifact: linux-x64
               - os: macos-15
                 artifact: mac-arm64
               - os: macos-15-intel
                 artifact: mac-x64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
              fetch-depth: 0
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - name: Install pinned Rust toolchain
           run: rustup show
         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
           with:
              workspaces: apps/app -> target
              key: ${{ matrix.artifact }}
              cache-targets: ${{ matrix.artifact == 'linux-x64' || matrix.artifact == 'mac-arm64' }}
              cache-on-failure: "true"
              save-if: ${{ github.ref == 'refs/heads/main' }}
         - run: npm ci
         - name: Install Linux native dependencies
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev libfreetype6-dev xvfb fonts-dejavu dbus
         - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
           if: matrix.artifact == 'linux-x64'
           with:
              distribution: temurin
              java-version: 17
         - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
           if: matrix.artifact == 'linux-x64'
           with:
              packages: platform-tools
         - name: Install Android NDK
           if: matrix.artifact == 'linux-x64'
           run: |
              sdkmanager "ndk;27.2.12479018"
              echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
              echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
         - name: Restore stable Android debug signing key
           if: matrix.artifact == 'linux-x64'
           env:
              ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
           run: |
              test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
              umask 077
              mkdir -p "$HOME/.android"
              printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
              chmod 600 "$HOME/.android/debug.keystore"
              echo "DUMP_TXT_ANDROID_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
         - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
           if: matrix.artifact == 'mac-arm64'
           with:
              xcode-version: latest-stable
         - name: Install CocoaPods
           if: matrix.artifact == 'mac-arm64'
           run: brew list cocoapods || brew install cocoapods
         - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7
           with:
              use-relative-cache-path: true
              cache-prefix: turbo-
         - run: npm run release
         - name: Verify Windows install
           if: matrix.artifact == 'windows-x64'
           timeout-minutes: 15
           shell: pwsh
           run: |
              $taskInstaller = @(Get-ChildItem -LiteralPath ./apps/app/out/make -Filter 'dump-txt-*-windows-x64.exe')
              if ($taskInstaller.Count -ne 1) { throw 'Expected one Windows installer.' }
              ./apps/app/tools/testTauriInstaller.ps1 -InstallerPath $taskInstaller[0].FullName
         - name: Verify Linux packages
           if: runner.os == 'Linux'
           timeout-minutes: 10
           run: dbus-run-session -- xvfb-run -a node apps/app/tools/testTauriInstall.mjs
         - name: Verify macOS packages
           if: runner.os == 'macOS'
           timeout-minutes: 10
           run: node apps/app/tools/testTauriInstall.mjs
         - name: Build Android APK
           if: matrix.artifact == 'linux-x64'
           run: npm run android --workspace @dump-txt/app
         - name: Verify Android APK signing certificate
           if: matrix.artifact == 'linux-x64'
           shell: bash
           run: |
              apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
              test -n "$apksigner"
              echo "Verifying APK with $apksigner"
              certificates=$("$apksigner" verify --print-certs apps/app/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk)
              printf '%s\n' "$certificates"
              certificate_sha256=$(printf '%s\n' "$certificates" | sed -n 's/^.* certificate SHA-256 digest: //p' | tr -d '\r' | sort -u)
              test "$certificate_sha256" = "059e85e1a8aa67d93842ed55cd8e7a470eef3624c21f50b0527adc061c741eea"
         - name: Enable Android emulator acceleration
           if: matrix.artifact == 'linux-x64'
           run: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
         - name: Test Android boot and file persistence
           if: matrix.artifact == 'linux-x64'
           timeout-minutes: 15
           uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
           with:
              api-level: 34
              target: google_apis
              arch: x86_64
              profile: pixel_7
              avd-name: dump-txt-ci
              emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
              script: node apps/app/tools/testMobileBoot.mjs android apps/app/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
         - name: Build iOS simulator
           if: matrix.artifact == 'mac-arm64'
           run: npm run ios --workspace @dump-txt/app
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: installer-${{ matrix.artifact }}
              retention-days: 7
              path: |
                 apps/app/out/make/dump-txt-*-windows-x64.exe
                 apps/app/out/make/dump-txt-*-windows-arm64.exe
                 apps/app/out/make/dump-txt-*-mac-*.dmg
                 apps/app/out/make/dump-txt-*-linux-*.AppImage
                 apps/app/out/make/dump-txt-*-linux-*.deb
                 apps/app/out/make/dump-txt-*-android-universal.apk
              if-no-files-found: error
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: failure()
           continue-on-error: true
           with:
              name: tauri-evidence-${{ matrix.artifact }}
              retention-days: 1
              include-hidden-files: true
              path: |
                 apps/app/.scratch/tauri-installer/
                 apps/app/.scratch/tauri-install/
                 apps/app/.scratch/tauri-build.json
                 apps/app/.scratch/mobile-boot/
              if-no-files-found: warn

   cleanup-artifacts:
      needs: [build, publish]
      if: ${{ always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
      runs-on: ubuntu-latest
      permissions:
         actions: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - name: Delete temporary workflow artifacts
           env:
              GH_TOKEN: ${{ github.token }}
           run: node apps/app/tools/releaseRetention.mjs artifacts

   publish:
      needs: build
      runs-on: ubuntu-latest
      permissions:
         contents: write
         actions: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
              fetch-depth: 0
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: installer-*
              merge-multiple: true
              path: artifacts
         - run: node apps/app/tools/release.mjs checksums artifacts
         - name: Publish an unreleased version
           id: release
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              result=$(node apps/app/tools/release.mjs publish artifacts)
              printf '%s\n' "$result"
              printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
         - name: Delete older stable releases
           if: steps.release.outputs.result == 'published'
           env:
              GH_TOKEN: ${{ github.token }}
           run: node apps/app/tools/releaseRetention.mjs releases "v$(node -p "JSON.parse(require('node:fs').readFileSync('apps/app/package.json', 'utf8')).version")"
         - name: Generate the published release demonstration and website
           if: steps.release.outputs.result == 'published'
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag=$(node -p "'v' + JSON.parse(require('node:fs').readFileSync('apps/app/package.json', 'utf8')).version")
              gh workflow run demo.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
              gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag" -f "commit=$GITHUB_SHA"
