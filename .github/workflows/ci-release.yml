name: CI and release

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: ci-release-${{ github.ref }}
   cancel-in-progress: false

jobs:
   build:
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 artifact: windows-x64
               - os: windows-11-arm
                 artifact: windows-arm64
                 nativeWindow: "false"
               - os: ubuntu-24.04
                 artifact: linux-x64
               - os: macos-15
                 artifact: mac-arm64
               - os: macos-15-intel
                 artifact: mac-x64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      env:
         TAURI_TEST_NATIVE_WINDOW: ${{ matrix.nativeWindow || 'true' }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - name: Install pinned Rust toolchain
           run: rustup show
         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
           with:
              workspaces: apps/app -> target
              key: ${{ matrix.artifact }}
              cache-on-failure: "true"
              save-if: ${{ github.ref == 'refs/heads/main' }}
         - run: npm ci
         - name: Install Linux native and driver dependencies
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev libfreetype6-dev webkit2gtk-driver xvfb fonts-dejavu openbox x11-utils xdotool imagemagick
         - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
           if: matrix.artifact == 'linux-x64'
           with:
              distribution: temurin
              java-version: 17
         - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
           if: matrix.artifact == 'linux-x64'
           with:
              packages: platform-tools
         - name: Install Android NDK
           if: matrix.artifact == 'linux-x64'
           run: |
              sdkmanager "ndk;27.2.12479018"
              echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
              echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
         - name: Restore stable Android debug signing key
           if: matrix.artifact == 'linux-x64' && github.event_name != 'pull_request'
           env:
              ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
           run: |
              test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
              umask 077
              mkdir -p "$HOME/.android"
              printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
              chmod 600 "$HOME/.android/debug.keystore"
              certificate_sha256=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
              test "$certificate_sha256" = "059e85e1a8aa67d93842ed55cd8e7a470eef3624c21f50b0527adc061c741eea"
         - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
           if: matrix.artifact == 'mac-arm64'
           with:
              xcode-version: latest-stable
         - name: Install CocoaPods
           if: matrix.artifact == 'mac-arm64'
           run: brew list cocoapods || brew install cocoapods
         - name: Verify committed iOS project
           if: matrix.artifact == 'mac-arm64'
           working-directory: apps/app
           run: test -f gen/apple/project.yml && test -f gen/apple/dump-txt.xcodeproj/project.pbxproj
         - name: Install native WebDriver
           if: runner.os != 'macOS'
           run: cargo install tauri-driver --version 2.0.6 --locked
         - name: Use the runner image's ARM64 Edge WebDriver
           if: matrix.artifact == 'windows-arm64'
           shell: pwsh
           run: |
              $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
              if (-not (Test-Path -LiteralPath $driver)) { throw "Expected the image's Edge WebDriver at $driver." }
              "MS_EDGE_DRIVER=$driver" | Add-Content -LiteralPath $env:GITHUB_ENV
              $env:EDGEWEBDRIVER | Add-Content -LiteralPath $env:GITHUB_PATH
         - run: npm run check
         - run: npm run unit
         - run: npm run integration
         - id: probe-build
           run: npm run build -- --probe --automation
         - name: Test native probe on macOS with reduced motion
           if: runner.os == 'macOS'
           env:
              TAURI_TEST_EXPECT_REDUCED_MOTION: "true"
           run: |
              defaults write com.apple.universalaccess reduceMotion -bool true
              defaults read com.apple.universalaccess reduceMotion
              npm run tauri-test -- --probe
         - name: Test native probe on macOS with normal motion
           if: runner.os == 'macOS'
           env:
              TAURI_TEST_EXPECT_REDUCED_MOTION: "false"
           run: |
              defaults write com.apple.universalaccess reduceMotion -bool false
              defaults read com.apple.universalaccess reduceMotion
              npm run tauri-test -- --probe
         - name: Test native probe on Windows
           if: runner.os == 'Windows'
           timeout-minutes: 5
           shell: pwsh
           run: ./apps/app/tools/tauriWindowsDiagnostics.ps1 -Mode Test
         - name: Collect Windows startup diagnostics
           if: always() && runner.os == 'Windows'
           shell: pwsh
           run: ./apps/app/tools/tauriWindowsDiagnostics.ps1 -Mode Collect
         - name: Test native probe on Linux
           if: runner.os == 'Linux'
           run: xvfb-run -a bash apps/app/tools/tauriLinuxDesktop.sh --probe
         - name: Build production persistence test app
           id: persistence-build
           if: ${{ !cancelled() && steps.probe-build.outcome == 'success' }}
           run: npm run build -- --automation
         - name: Test native persistence on macOS
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'macOS' }}
           timeout-minutes: 10
           run: npm run tauri-test
         - name: Test native persistence on Windows
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'Windows' }}
           timeout-minutes: 10
           shell: pwsh
           run: ./apps/app/tools/tauriWindowsDiagnostics.ps1 -Mode Test -Persistence
         - name: Collect Windows persistence startup diagnostics
           if: always() && runner.os == 'Windows'
           shell: pwsh
           run: ./apps/app/tools/tauriWindowsDiagnostics.ps1 -Mode Collect -Persistence
         - name: Test native persistence on Linux
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'Linux' }}
           timeout-minutes: 10
           run: xvfb-run -a bash apps/app/tools/tauriLinuxDesktop.sh
         - name: Build production packages
           id: package-build
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' }}
           run: npm run build
         - name: Build Android APK
           id: android-build
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && matrix.artifact == 'linux-x64' }}
           run: npm run android --workspace @dump-txt/app
         - name: Enable Android emulator acceleration
           if: ${{ !cancelled() && steps.android-build.outcome == 'success' && matrix.artifact == 'linux-x64' }}
           run: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
         - name: Test Android boot and file persistence
           if: ${{ !cancelled() && steps.android-build.outcome == 'success' && matrix.artifact == 'linux-x64' }}
           timeout-minutes: 15
           uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
           env:
              MOBILE_REQUIRE_ANDROID_USER_AGENT: "1"
              MOBILE_REQUIRE_RENDERER_TEXT: "1"
              MOBILE_REQUIRE_EDITOR_AUTOSAVE: "1"
           with:
              api-level: 34
              target: google_apis
              arch: x86_64
              profile: pixel_7
              avd-name: dump-txt-ci
              emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
              script: node apps/app/tools/testMobileBoot.mjs android apps/app/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
         - name: Build iOS simulator
           id: ios-build
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && matrix.artifact == 'mac-arm64' }}
           run: npm run ios --workspace @dump-txt/app
         - name: Test iOS boot and file persistence
           if: ${{ !cancelled() && steps.ios-build.outcome == 'success' && matrix.artifact == 'mac-arm64' }}
           timeout-minutes: 15
           run: node apps/app/tools/testMobileBoot.mjs ios apps/app/gen/apple/build/arm64-sim/dump-txt.app
         - name: Verify Windows install and Electron upgrade
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && matrix.artifact == 'windows-x64' }}
           timeout-minutes: 15
           shell: pwsh
           run: |
              $taskInstaller = @(Get-ChildItem -LiteralPath ./apps/app/out/make -Filter 'dump-txt-*-windows-x64.exe')
              if ($taskInstaller.Count -ne 1) { throw 'Expected one Windows installer.' }
              ./apps/app/tools/testTauriInstaller.ps1 -InstallerPath $taskInstaller[0].FullName -ExpectedExecutablePath ./apps/app/target/release/dump-txt.exe
         - name: Inspect Linux package dependencies
           working-directory: apps/app
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && runner.os == 'Linux' }}
           run: |
              mkdir -p .scratch/tauri-package
              readelf --version-info target/release/dump-txt > .scratch/tauri-package/elf-versions.txt
              ldd target/release/dump-txt > .scratch/tauri-package/native-dependencies.txt
              dpkg-deb --info out/make/dump-txt-*-linux-*.deb > .scratch/tauri-package/debian-control.txt
              dpkg-query -W libwebkit2gtk-4.1-0 libc6 > .scratch/tauri-package/host-runtime.txt
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' }}
           with:
              name: installer-${{ matrix.artifact }}
              path: |
                 apps/app/out/make/dump-txt-*-windows-x64.exe
                 apps/app/out/make/dump-txt-*-windows-arm64.exe
                 apps/app/out/make/dump-txt-*-mac-*.dmg
                 apps/app/out/make/dump-txt-*-linux-*.AppImage
                 apps/app/out/make/dump-txt-*-linux-*.deb
                 apps/app/out/make/dump-txt-*-android-universal.apk
              if-no-files-found: error
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: always()
           with:
              name: window-layouts-${{ matrix.artifact }}
              include-hidden-files: true
              path: |
                 apps/app/.scratch/tauri-persistence/**/layout-*.png
                 apps/app/.scratch/tauri-persistence/**/menu-*.png
                 apps/app/.scratch/tauri-persistence/**/maximized.png
                 apps/app/.scratch/tauri-persistence/**/chrome-failure.png
                 apps/app/.scratch/tauri-persistence/**/window-chrome.json
                 apps/app/.scratch/tauri-persistence/**/native-window*.json
                 apps/app/.scratch/tauri-persistence/**/native-*.jsonl
                 apps/app/.scratch/tauri-persistence/**/pointer-*-before.png
              if-no-files-found: warn
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: always()
           with:
              name: tauri-evidence-${{ matrix.artifact }}
              include-hidden-files: true
              path: |
                 apps/app/.scratch/tauri-test/
                 apps/app/.scratch/tauri-persistence/
                 apps/app/.scratch/tauri-installer/
                 apps/app/.scratch/tauri-package/
                 apps/app/.scratch/tauri-build.json
                 apps/app/.scratch/mobile-boot/
                 apps/app/gen/apple/build/arm64-sim/
                 apps/app/target/release/dump-txt
                 apps/app/target/release/dump-txt.exe
              if-no-files-found: warn

   publish:
      needs: build
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      runs-on: ubuntu-latest
      permissions:
         contents: write
         actions: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: installer-*
              merge-multiple: true
              path: artifacts
         - run: node apps/app/tools/release.mjs checksums artifacts
         - name: Publish an unreleased version
           id: release
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_DRAFT_ONLY: ${{ vars.DUMP_TXT_RELEASE_REVIEW }}
           run: |
              result=$(node apps/app/tools/release.mjs publish artifacts)
              printf '%s\n' "$result"
              printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
         - name: Generate the published release demonstration and website
           if: steps.release.outputs.result == 'published'
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag=$(node -p "'v' + JSON.parse(require('node:fs').readFileSync('apps/app/package.json', 'utf8')).version")
              gh workflow run demo.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
              gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag" -f "commit=$GITHUB_SHA"
