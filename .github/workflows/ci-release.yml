name: CI and release

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: ci-release-${{ github.ref }}
   cancel-in-progress: false

jobs:
   build:
      runs-on: windows-latest
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - run: npm ci
         - run: node node_modules/electron/install.js
         - run: npm run check
         - run: npm run unit
         - run: npm run integration
         - run: npm run make
         - run: npm run electron-test
         - run: node tools/release.mjs checksums
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: windows-installer
              path: |
                 out/make/nsis/dump-txt-Setup-*.exe
                 out/make/nsis/SHA256SUMS
              if-no-files-found: error

   publish:
      needs: build
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      runs-on: ubuntu-latest
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              name: windows-installer
              path: artifacts
         - name: Publish an unreleased version
           env:
              GH_TOKEN: ${{ github.token }}
           run: node tools/release.mjs publish artifacts
