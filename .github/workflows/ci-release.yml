name: CI and release

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: ci-release-${{ github.ref }}
   cancel-in-progress: false

jobs:
   build:
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 artifact: windows-x64
               - os: ubuntu-24.04
                 artifact: linux-x64
               - os: macos-15
                 artifact: mac-arm64
               - os: macos-15-intel
                 artifact: mac-x64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      env:
         TAURI_TEST_NATIVE_WINDOW: "true"
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - name: Install pinned Rust toolchain
           run: rustup show
         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
           with:
              workspaces: apps/desktop -> target
              key: ${{ matrix.artifact }}
              cache-on-failure: "true"
              save-if: ${{ github.ref == 'refs/heads/main' }}
         - run: npm ci
         - name: Install Linux native and driver dependencies
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev libfreetype6-dev webkit2gtk-driver xvfb fonts-dejavu openbox x11-utils xdotool imagemagick
         - name: Install native WebDriver
           if: runner.os != 'macOS'
           run: cargo install tauri-driver --version 2.0.6 --locked
         - run: npm run check
         - run: npm run unit
         - run: npm run integration
         - id: probe-build
           run: npm run build -- --probe --automation
         - name: Test native probe on macOS with reduced motion
           if: runner.os == 'macOS'
           env:
              TAURI_TEST_EXPECT_REDUCED_MOTION: "true"
           run: |
              defaults write com.apple.universalaccess reduceMotion -bool true
              defaults read com.apple.universalaccess reduceMotion
              npm run tauri-test -- --probe
         - name: Test native probe on macOS with normal motion
           if: runner.os == 'macOS'
           env:
              TAURI_TEST_EXPECT_REDUCED_MOTION: "false"
           run: |
              defaults write com.apple.universalaccess reduceMotion -bool false
              defaults read com.apple.universalaccess reduceMotion
              npm run tauri-test -- --probe
         - name: Test native probe on Windows
           if: runner.os == 'Windows'
           timeout-minutes: 5
           shell: pwsh
           run: ./apps/desktop/tools/tauriWindowsDiagnostics.ps1 -Mode Test
         - name: Collect Windows startup diagnostics
           if: always() && runner.os == 'Windows'
           shell: pwsh
           run: ./apps/desktop/tools/tauriWindowsDiagnostics.ps1 -Mode Collect
         - name: Test native probe on Linux
           if: runner.os == 'Linux'
           run: xvfb-run -a bash apps/desktop/tools/tauriLinuxDesktop.sh --probe
         - name: Build production persistence test app
           id: persistence-build
           if: ${{ !cancelled() && steps.probe-build.outcome == 'success' }}
           run: npm run build -- --automation
         - name: Test native persistence on macOS
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'macOS' }}
           timeout-minutes: 10
           run: npm run tauri-test
         - name: Test native persistence on Windows
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'Windows' }}
           timeout-minutes: 10
           shell: pwsh
           run: ./apps/desktop/tools/tauriWindowsDiagnostics.ps1 -Mode Test -Persistence
         - name: Collect Windows persistence startup diagnostics
           if: always() && runner.os == 'Windows'
           shell: pwsh
           run: ./apps/desktop/tools/tauriWindowsDiagnostics.ps1 -Mode Collect -Persistence
         - name: Test native persistence on Linux
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' && runner.os == 'Linux' }}
           timeout-minutes: 10
           run: xvfb-run -a bash apps/desktop/tools/tauriLinuxDesktop.sh
         - name: Build production packages
           id: package-build
           if: ${{ !cancelled() && steps.persistence-build.outcome == 'success' }}
           run: npm run build
         - name: Verify Windows install and Electron upgrade
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && runner.os == 'Windows' }}
           timeout-minutes: 15
           shell: pwsh
           run: |
              $taskInstaller = @(Get-ChildItem -LiteralPath ./apps/desktop/out/make -Filter 'dump-txt-*-windows-x64.exe')
              if ($taskInstaller.Count -ne 1) { throw 'Expected one Windows installer.' }
              ./apps/desktop/tools/testTauriInstaller.ps1 -InstallerPath $taskInstaller[0].FullName -ExpectedExecutablePath ./apps/desktop/target/release/dump-txt.exe
         - name: Inspect Linux package dependencies
           working-directory: apps/desktop
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' && runner.os == 'Linux' }}
           run: |
              mkdir -p .scratch/tauri-package
              readelf --version-info target/release/dump-txt > .scratch/tauri-package/elf-versions.txt
              ldd target/release/dump-txt > .scratch/tauri-package/native-dependencies.txt
              dpkg-deb --info out/make/dump-txt-*-linux-*.deb > .scratch/tauri-package/debian-control.txt
              dpkg-query -W libwebkit2gtk-4.1-0 libc6 > .scratch/tauri-package/host-runtime.txt
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: ${{ !cancelled() && steps.package-build.outcome == 'success' }}
           with:
              name: installer-${{ matrix.artifact }}
              path: |
                 apps/desktop/out/make/dump-txt-*-windows-x64.exe
                 apps/desktop/out/make/dump-txt-*-mac-*.dmg
                 apps/desktop/out/make/dump-txt-*-linux-*.AppImage
                 apps/desktop/out/make/dump-txt-*-linux-*.deb
              if-no-files-found: error
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: always()
           with:
              name: window-layouts-${{ matrix.artifact }}
              include-hidden-files: true
              path: |
                 apps/desktop/.scratch/tauri-persistence/**/layout-*.png
                 apps/desktop/.scratch/tauri-persistence/**/menu-*.png
                 apps/desktop/.scratch/tauri-persistence/**/maximized.png
                 apps/desktop/.scratch/tauri-persistence/**/chrome-failure.png
                 apps/desktop/.scratch/tauri-persistence/**/window-chrome.json
                 apps/desktop/.scratch/tauri-persistence/**/native-window*.json
                 apps/desktop/.scratch/tauri-persistence/**/native-*.jsonl
                 apps/desktop/.scratch/tauri-persistence/**/pointer-*-before.png
              if-no-files-found: warn
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: always()
           with:
              name: tauri-evidence-${{ matrix.artifact }}
              include-hidden-files: true
              path: |
                 apps/desktop/.scratch/tauri-test/
                 apps/desktop/.scratch/tauri-persistence/
                 apps/desktop/.scratch/tauri-installer/
                 apps/desktop/.scratch/tauri-package/
                 apps/desktop/.scratch/tauri-build.json
                 apps/desktop/target/release/dump-txt
                 apps/desktop/target/release/dump-txt.exe
              if-no-files-found: warn

   publish:
      needs: build
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      runs-on: ubuntu-latest
      permissions:
         contents: write
         actions: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: installer-*
              merge-multiple: true
              path: artifacts
         - run: node apps/desktop/tools/release.mjs checksums artifacts
         - name: Publish an unreleased version
           id: release
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_DRAFT_ONLY: ${{ vars.DUMP_TXT_RELEASE_REVIEW }}
           run: |
              result=$(node apps/desktop/tools/release.mjs publish artifacts)
              printf '%s\n' "$result"
              printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
         - name: Generate the published release demonstration and website
           if: steps.release.outputs.result == 'published'
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag=$(node -p "'v' + JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json', 'utf8')).version")
              gh workflow run demo.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
              gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
