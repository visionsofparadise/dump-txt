appId: com.visionsofparadise.dump-txt
productName: dump.txt
directories:
   buildResources: assets
   output: out/make
win:
   executableName: dump-txt
   icon: assets/icon.ico
   target:
      - target: nsis
        arch: x64
nsis:
   artifactName: dump-txt-Setup-${version}.exe
   oneClick: false
   perMachine: false
   allowElevation: false
   allowToChangeInstallationDirectory: false
   runAfterFinish: true
   include: assets/installer.nsh
mac:
   icon: assets/icon.icns
   category: public.app-category.productivity
   identity: null
   hardenedRuntime: false
   notarize: false
   artifactName: dump-txt-${version}-mac-${arch}.${ext}
   target: dmg
linux:
   executableName: dump-txt
   icon: assets/icon.png
   category: Utility
   maintainer: Matt Cavender
   artifactName: dump-txt-${version}-linux-${arch}.${ext}
   target:
      - AppImage
      - deb
