[package]
name = "dump-txt"
version = "0.2.0"
description = "A minimal desktop scratchpad with pages"
authors = ["Matt Cavender"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "dump_txt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
font-kit = { version = "=0.14.3", default-features = false, features = ["source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
probe = []
automation = ["probe", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
