[package]
name = "dump-txt"
version = "0.2.0"
description = "A minimal desktop scratchpad with pages"
authors = ["Matt Cavender"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "dump_txt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
probe = []
