<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
a{color:inherit}a:hover{color:inherit}
textarea::placeholder{color:light-dark(#a3a3a3,#5c5c5c)}
@keyframes blobDrop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="color-scheme: {{ scheme }}; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:light-dark(#d4d4d4,#141414); color:light-dark(#1a1a1a,#e6e6e6);">
  <div onKeyDown="{{ onKey }}" style="width:min(960px,100%); height:min(640px,calc(100vh - 48px)); display:grid; grid-template-rows:32px 32px minmax(0,1fr) 32px; background:light-dark(#fafafa,#1e1e1e); border:1px solid light-dark(#b8b8b8,#3a3a3a); border-radius:8px; box-shadow:0 24px 64px rgba(0,0,0,.28); position:relative; overflow:hidden;">

    <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; user-select:none; background:light-dark(#e6e6e6,#2c2c2c);">
      <div style="display:flex; height:100%;">
        <button onClick="{{ toggleMenu }}" aria-label="App menu" style="width:46px; height:32px; border:0; background:{{ menuBtnBg }}; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#dadada,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
        </button>
      </div>
      <div style="font-size:12px; letter-spacing:.14em; color:light-dark(#9a9a9a,#6a6a6a);">dump.txt</div>
      <div style="display:flex; justify-content:flex-end; height:100%;">
        <button aria-label="Minimize" style="width:46px; height:32px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#dadada,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button aria-label="Maximize" style="width:46px; height:32px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#dadada,#383838)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
        <button aria-label="Close window" style="width:46px; height:32px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:#c42b1c; color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeMenu }}" style="position:absolute; inset:0; z-index:5;"></div>
      <div style="position:absolute; top:32px; left:0; z-index:6; width:264px; padding:4px 0; background:light-dark(#ffffff,#2b2b2b); border:1px solid light-dark(#dcdcdc,#404040); border-left:0; border-top:0; border-radius:0 0 6px 0; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:blobDrop .12s ease-out; font-size:13px; color:light-dark(#1a1a1a,#e6e6e6);">
        <button onClick="{{ closeMenu }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
          <span>Open…</span><span style="color:light-dark(#9a9a9a,#707070);">Ctrl+O</span>
        </button>
        <div style="height:1px; margin:4px 0; background:light-dark(#ececec,#3a3a3a);"></div>
        <button onClick="{{ undo }}" disabled="{{ noUndo }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default; opacity:{{ undoOpacity }};" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
          <span>Undo</span><span style="color:light-dark(#9a9a9a,#707070);">Ctrl+Z</span>
        </button>
        <button onClick="{{ redo }}" disabled="{{ noRedo }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default; opacity:{{ redoOpacity }};" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
          <span>Redo</span><span style="color:light-dark(#9a9a9a,#707070);">Ctrl+Y</span>
        </button>
        <button onClick="{{ openFind }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Find</span><span style="color:light-dark(#9a9a9a,#707070);">Ctrl+F</span>
        </button>
        <div style="height:1px; margin:4px 0; background:light-dark(#ececec,#3a3a3a);"></div>

        <div style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; padding:3px 12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
          <span>Text size</span>
          <span style="display:flex; align-items:center; gap:2px;">
            <button onClick="{{ sizeDown }}" aria-label="Smaller text" style="width:26px; height:24px; border:0; background:transparent; color:inherit; cursor:default; border-radius:3px; display:grid; place-items:center;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span style="min-width:34px; text-align:center; font-variant-numeric:tabular-nums; color:light-dark(#6a6a6a,#a0a0a0);">{{ textSize }} pt</span>
            <button onClick="{{ sizeUp }}" aria-label="Larger text" style="width:26px; height:24px; border:0; background:transparent; color:inherit; cursor:default; border-radius:3px; display:grid; place-items:center;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          </span>
        </div>

        <button onClick="{{ toggleFontList }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:{{ fontRowBg }}; color:inherit; font:inherit; text-align:left; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 15 4-8 4 8"/><path d="M4 13h6"/><circle cx="18" cy="12" r="3"/><path d="M21 9v6"/></svg>
          <span>Font</span>
          <span style="display:flex; align-items:center; gap:6px; color:light-dark(#6a6a6a,#a0a0a0); max-width:130px;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ fontName }}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ fontChevron }}; transition:transform .15s; flex:none;"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <sc-if value="{{ fontListOpen }}" hint-placeholder-val="{{ false }}">
          <div style="max-height:176px; overflow-y:auto; padding:2px 0; background:light-dark(#f6f6f6,#262626);">
            <sc-for list="{{ fonts }}" as="f" hint-placeholder-count="3">
              <button onClick="{{ f.pick }}" style="display:grid; grid-template-columns:14px 1fr; align-items:center; gap:12px; width:100%; padding:5px 12px 5px 38px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default;" style-hover="background:light-dark(#ebebeb,#333333)">
                <span style="display:grid; place-items:center; color:light-dark(#1a1a1a,#e6e6e6); opacity:{{ f.checkOpacity }};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                <span style="font-family:{{ f.stack }}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ f.name }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <div style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; padding:5px 12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></svg>
          <span>Appearance</span>
          <span style="display:flex; padding:2px; gap:2px; background:light-dark(#efefef,#3a3a3a); border-radius:4px; font-size:11px;">
            <sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
              <button onClick="{{ t.pick }}" style="padding:2px 8px; border:0; border-radius:3px; background:{{ t.bg }}; color:{{ t.color }}; box-shadow:{{ t.shadow }}; font:inherit; cursor:default;">{{ t.label }}</button>
            </sc-for>
          </span>
        </div>
        <div style="height:1px; margin:4px 0; background:light-dark(#ececec,#3a3a3a);"></div>
        <button onClick="{{ closePage }}" style="display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; width:100%; padding:7px 12px; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:default;" style-hover="background:light-dark(#f0f0f0,#383838)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          <span>Close</span><span style="color:light-dark(#9a9a9a,#707070);">Ctrl+W</span>
        </button>
      </div>
    </sc-if>

    <div style="display:grid; grid-template-columns:minmax(0,1fr) 46px; background:light-dark(#f0f0f0,#252525); color:light-dark(#8a8a8a,#6e6e6e);">
      <button onClick="{{ goUp }}" aria-label="{{ upLabel }}" style="height:100%; padding:0 0 0 46px; box-sizing:border-box; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <sc-if value="{{ atTop }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></sc-if>
        <sc-if value="{{ notTop }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></sc-if>
      </button>
      <button onClick="{{ goTop }}" disabled="{{ atTop }}" aria-label="First page" style="height:100%; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center; opacity:{{ topOpacity }};" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg>
      </button>
    </div>

    <div ref="{{ viewportRef }}" style="position:relative; overflow:hidden; min-height:0;">
      <sc-if value="{{ findOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:8px; right:12px; z-index:4; display:flex; align-items:center; gap:8px; padding:6px 8px 6px 12px; background:light-dark(#ffffff,#2b2b2b); border:1px solid light-dark(#dcdcdc,#404040); border-radius:4px; box-shadow:0 6px 20px rgba(0,0,0,.14); font-size:13px; animation:blobDrop .12s ease-out;">
          <input ref="{{ findRef }}" value="{{ query }}" onChange="{{ onQuery }}" onKeyDown="{{ onFindKey }}" placeholder="Find" style="width:180px; border:0; outline:0; background:transparent; color:inherit; font:inherit; font-size:13px;" />
          <span style="color:light-dark(#9a9a9a,#707070); font-variant-numeric:tabular-nums; white-space:nowrap;">{{ matchLabel }}</span>
          <button onClick="{{ findPrev }}" aria-label="Previous match" style="width:24px; height:24px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
          <button onClick="{{ findNext }}" aria-label="Next match" style="width:24px; height:24px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <button onClick="{{ closeFind }}" aria-label="Close find" style="width:24px; height:24px; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#f0f0f0,#383838)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      </sc-if>
      <div style="height:100%; display:grid; grid-auto-rows:100%; transform:{{ stackTransform }}; transition:transform .32s cubic-bezier(.2,.7,.2,1);">
        <sc-for list="{{ pages }}" as="page" hint-placeholder-count="1">
          <textarea ref="{{ page.ref }}" value="{{ page.text }}" onChange="{{ page.onChange }}" placeholder="{{ page.placeholder }}" spellcheck="false" style="width:100%; height:100%; box-sizing:border-box; padding:10px 14px; border:0; outline:0; resize:none; background:transparent; color:inherit; font-family:{{ fontStack }}; font-size:{{ textSize }}pt; line-height:1.5;"></textarea>
        </sc-for>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:minmax(0,1fr) 46px 46px; background:light-dark(#f0f0f0,#252525); color:light-dark(#8a8a8a,#6e6e6e);">
      <button onClick="{{ goDown }}" aria-label="{{ downLabel }}" style="height:100%; padding:0 0 0 92px; box-sizing:border-box; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <sc-if value="{{ atEnd }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></sc-if>
        <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></sc-if>
      </button>
      <button onClick="{{ closePage }}" aria-label="Delete page" style="height:100%; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center;" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      </button>
      <button onClick="{{ goBottom }}" disabled="{{ atEnd }}" aria-label="Last page" style="height:100%; border:0; background:transparent; color:inherit; cursor:default; display:grid; place-items:center; opacity:{{ bottomOpacity }};" style-hover="background:light-dark(#e8e8e8,#2a2a2a); color:light-dark(#1a1a1a,#e6e6e6)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system'|'light'|'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Consolas&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;textSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:11,&quot;min&quot;:8,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
const FALLBACK_FONTS = ["Consolas", "Cascadia Mono", "Segoe UI", "Calibri", "Arial", "Verdana", "Tahoma", "Georgia", "Cambria", "Times New Roman", "Courier New"];
const stackFor = name => `"${name}", ${/mono|consol|courier|cascadia/i.test(name) ? "monospace" : /georgia|cambria|times|serif/i.test(name) ? "serif" : "sans-serif"}`;
const blank = () => ({ id: Date.now() + Math.random(), text: "", past: [], future: [] });

class Component extends DCLogic {
  state = { pages: [blank()], index: 0, menuOpen: false, findOpen: false, query: "", matchIdx: -1, textSize: null, font: null, theme: null, fontListOpen: false, fontList: null };
  refs = {};
  findRef = React.createRef();
  viewportRef = React.createRef();
  commitTimer = null;

  ref(id) { return this.refs[id] || (this.refs[id] = React.createRef()); }
  cur() { return this.state.pages[this.state.index]; }

  componentDidMount() { this.focusPage(); }
  componentDidUpdate(_, prev) {
    if (prev.index !== this.state.index || prev.pages.length !== this.state.pages.length) this.focusPage();
    if (!prev.findOpen && this.state.findOpen) setTimeout(() => this.findRef.current && this.findRef.current.focus({ preventScroll: true }), 0);
  }
  focusPage() {
    const p = this.cur(); if (!p) return;
    setTimeout(() => {
      const el = this.ref(p.id).current;
      if (el && !this.state.findOpen && !this.state.menuOpen) el.focus({ preventScroll: true });
      if (this.viewportRef.current) this.viewportRef.current.scrollTop = 0;
    }, 0);
  }

  updatePage(id, fn) { this.setState(s => ({ pages: s.pages.map(p => p.id === id ? fn(p) : p) })); }
  onChange(id, e) {
    const text = e.target.value;
    const p = this.state.pages.find(p => p.id === id);
    if (!this.commitTimer) {
      const snapshot = p.text;
      this.updatePage(id, q => ({ ...q, text, past: [...q.past, snapshot].slice(-100), future: [] }));
    } else this.updatePage(id, q => ({ ...q, text }));
    clearTimeout(this.commitTimer);
    this.commitTimer = setTimeout(() => { this.commitTimer = null; }, 600);
  }
  undo = () => {
    const p = this.cur(); if (!p || !p.past.length) return;
    this.commitTimer = null;
    this.updatePage(p.id, q => ({ ...q, text: q.past[q.past.length - 1], past: q.past.slice(0, -1), future: [q.text, ...q.future] }));
  };
  redo = () => {
    const p = this.cur(); if (!p || !p.future.length) return;
    this.commitTimer = null;
    this.updatePage(p.id, q => ({ ...q, text: q.future[0], future: q.future.slice(1), past: [...q.past, q.text] }));
  };

  // Mount the new page first, then move to it a frame later so the slide animates.
  goUp = () => {
    const s = this.state;
    if (s.index === 0) {
      this.setState({ pages: [blank(), ...s.pages], index: 1, menuOpen: false }, () => requestAnimationFrame(() => this.setState({ index: 0 })));
    } else this.setState({ index: s.index - 1, menuOpen: false });
  };
  goDown = () => {
    const s = this.state;
    if (s.index >= s.pages.length - 1) {
      this.setState({ pages: [...s.pages, blank()], menuOpen: false }, () => requestAnimationFrame(() => this.setState(t => ({ index: t.pages.length - 1 }))));
    } else this.setState({ index: s.index + 1, menuOpen: false });
  };
  goTop = () => this.setState({ index: 0, menuOpen: false });
  goBottom = () => this.setState(s => ({ index: s.pages.length - 1, menuOpen: false }));
  closePage = () => this.setState(s => {
    const pages = s.pages.filter((_, i) => i !== s.index);
    if (!pages.length) pages.push(blank());
    return { pages, index: Math.min(s.index, pages.length - 1), menuOpen: false };
  });

  matches() {
    const p = this.cur(), q = this.state.query;
    if (!p || !q) return [];
    const out = [], hay = p.text.toLowerCase(), needle = q.toLowerCase();
    let i = hay.indexOf(needle);
    while (i !== -1) { out.push(i); i = hay.indexOf(needle, i + needle.length); }
    return out;
  }
  jump(dir) {
    const m = this.matches(); if (!m.length) return;
    let idx = this.state.matchIdx + dir;
    if (idx < 0) idx = m.length - 1; if (idx >= m.length) idx = 0;
    this.setState({ matchIdx: idx });
    const el = this.ref(this.cur().id).current;
    if (el) { el.focus({ preventScroll: true }); el.setSelectionRange(m[idx], m[idx] + this.state.query.length); setTimeout(() => this.findRef.current && this.findRef.current.focus({ preventScroll: true }), 0); }
  }
  findNext = () => this.jump(1);
  findPrev = () => this.jump(-1);
  openFind = () => this.setState({ findOpen: true, menuOpen: false, matchIdx: -1 });
  closeFind = () => { this.setState({ findOpen: false }); this.focusPage(); };
  onQuery = e => this.setState({ query: e.target.value, matchIdx: -1 }, () => this.jump(1));
  onFindKey = e => {
    if (e.key === "Enter") { e.preventDefault(); this.jump(e.shiftKey ? -1 : 1); }
    if (e.key === "Escape") this.closeFind();
  };

  themeSetting() { return this.state.theme ?? this.props.theme ?? "system"; }
  effectiveTheme() {
    const t = this.themeSetting();
    if (t !== "system") return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  size() { return this.state.textSize ?? this.props.textSize ?? 11; }
  sizeUp = () => this.setState({ textSize: Math.min(24, this.size() + 1) });
  sizeDown = () => this.setState({ textSize: Math.max(8, this.size() - 1) });

  toggleFontList = async () => {
    const open = !this.state.fontListOpen;
    this.setState({ fontListOpen: open });
    if (open && !this.state.fontList && window.queryLocalFonts) {
      try {
        const fams = [...new Set((await window.queryLocalFonts()).map(f => f.family))].sort((a, b) => a.localeCompare(b));
        if (fams.length) this.setState({ fontList: fams });
      } catch (e) { /* permission denied → keep fallback list */ }
    }
  };

  onKey = e => {
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === "Escape") { this.setState({ menuOpen: false, fontListOpen: false }); return; }
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); this.undo(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); this.redo(); }
    else if (k === "f") { e.preventDefault(); this.openFind(); }
    else if (k === "o") { e.preventDefault(); }
    else if (k === "w") { e.preventDefault(); this.closePage(); }
    else if (k === "=" || k === "+") { e.preventDefault(); this.sizeUp(); }
    else if (k === "-") { e.preventDefault(); this.sizeDown(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); e.shiftKey ? this.goTop() : this.goUp(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); e.shiftKey ? this.goBottom() : this.goDown(); }
  };

  renderVals() {
    const { pages, index, menuOpen, findOpen, query, matchIdx, fontListOpen } = this.state;
    const p = pages[index];
    const m = this.matches();
    const atTop = index === 0, atEnd = index >= pages.length - 1;
    const theme = this.themeSetting();
    const dark = this.effectiveTheme() === "dark";
    const fontName = this.state.font ?? this.props.font ?? "Consolas";
    const list = this.state.fontList || FALLBACK_FONTS;
    return {
      scheme: theme === "system" ? "light dark" : theme,
      textSize: this.size(), fontName, fontStack: stackFor(fontName),
      fonts: list.map(name => ({ name, stack: stackFor(name), checkOpacity: name === fontName ? 1 : 0, pick: () => this.setState({ font: name, fontListOpen: false }) })),
      fontListOpen, fontChevron: fontListOpen ? "rotate(180deg)" : "none",
      fontRowBg: fontListOpen ? "light-dark(#f0f0f0,#383838)" : "transparent",
      themes: ["system", "light", "dark"].map(t => ({
        label: t[0].toUpperCase() + t.slice(1), pick: () => this.setState({ theme: t }),
        bg: theme === t ? (dark ? "#555555" : "#ffffff") : "transparent",
        color: theme === t ? (dark ? "#f0f0f0" : "#1a1a1a") : (dark ? "#a0a0a0" : "#6a6a6a"),
        shadow: theme === t ? "0 1px 2px rgba(0,0,0,.15)" : "none",
      })),
      pages: pages.map(pg => ({ ...pg, ref: this.ref(pg.id), onChange: e => this.onChange(pg.id, e), placeholder: pages.length === 1 ? "Just start typing." : "" })),
      stackTransform: `translateY(-${index * 100}%)`,
      viewportRef: this.viewportRef,
      menuOpen, findOpen, query,
      menuBtnBg: menuOpen ? "light-dark(#dadada,#383838)" : "transparent",
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen, fontListOpen: false })),
      closeMenu: () => this.setState({ menuOpen: false, fontListOpen: false }),
      noUndo: !p || !p.past.length, noRedo: !p || !p.future.length,
      undoOpacity: p && p.past.length ? 1 : .4, redoOpacity: p && p.future.length ? 1 : .4,
      atTop, notTop: !atTop, atEnd, notEnd: !atEnd,
      topOpacity: atTop ? .35 : 1, bottomOpacity: atEnd ? .35 : 1,
      upLabel: atTop ? "New page above" : "Previous page", downLabel: atEnd ? "New page" : "Next page",
      matchLabel: query ? (m.length ? `${matchIdx + 1} / ${m.length}` : "0 / 0") : "",
      findRef: this.findRef,
      undo: this.undo, redo: this.redo, goUp: this.goUp, goDown: this.goDown, goTop: this.goTop, goBottom: this.goBottom, closePage: this.closePage,
      openFind: this.openFind, closeFind: this.closeFind, onQuery: this.onQuery, onFindKey: this.onFindKey, findNext: this.findNext, findPrev: this.findPrev,
      sizeUp: this.sizeUp, sizeDown: this.sizeDown, toggleFontList: this.toggleFontList, onKey: this.onKey,
    };
  }
}
</script>
</body>
</html>
